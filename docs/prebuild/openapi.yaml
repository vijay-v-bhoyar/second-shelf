          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignDraft"
  /campaigns/{id}:
    get:
      operationId: readCampaign
      summary: Read a scoped campaign and version
      description: Read a scoped campaign and version
      x-required-role: merchant
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
