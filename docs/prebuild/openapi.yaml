components:
  securitySchemes:
    MerchantSession:
      type: apiKey
      in: cookie
      name: ss_merchant
      description: Verified merchant identity or isolated synthetic demo lease; role checks per operation.
    ShopperSession:
      type: apiKey
      in: cookie
      name: ss_shopper
      description: Opaque server-scoped shopper session; no merchant rights.
    StaffSession:
      type: apiKey
      in: cookie
      name: ss_staff
      description: Scoped expiring sample credential; real identity-provider verification remains unconfigured.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: *a1
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - INVALID_INPUT
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - STALE_INVENTORY
            - NO_ELIGIBLE_ITEMS
            - PROVIDER_UNAVAILABLE
            - RATE_LIMITED
            - BUDGET_EXHAUSTED
            - CONFIGURATION_NOT_READY
            - INSUFFICIENT_EVIDENCE
        message: *a1
        requestId: *a2
        retryable:
          type: boolean
      required:
        - code
        - message
        - requestId
        - retryable
      description: "SS-S6-LOCAL-1 target: sanitized message maximum 200 characters, stable code/requestId/retryable.
        Bound validation issue messages at the server; do not expose input values or secrets. Runtime
        alignment remains S5-B02."
    Ack:
      type: object
      additionalProperties: false
      properties:
        id: *a2
        revision: *a3
      required:
        - id
        - revision
    DemoSession:
      type: object
      additionalProperties: false
      properties:
        storeId: *a2
        expiresAt: *a4
        dataMode:
          type: string
          enum:
            - demo
        providerMode:
          type: string
          enum:
            - live
            - fixture
            - unconfigured
      required:
        - storeId
        - expiresAt
        - dataMode
        - providerMode
    ImportPreview:
      type: object
      additionalProperties: false
      properties:
        id: *a2
        status:
          type: string
          enum:
            - staged
            - validated
            - rejected
        rowCount: *a13
        acceptedRowNumbers:
          type: array
          items: *a13
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              row: *a13
              field: *a1
              message: *a1
            required:
              - row
              - field
              - message
        baseRevision:
          type: integer
          minimum: 1
      required:
        - id
        - status
        - rowCount
        - acceptedRowNumbers
        - errors
        - baseRevision
    InventoryItem:
      type: object
      additionalProperties: false
      properties:
        sku: *a1
        isbn13:
          type: string
          pattern: ^[0-9]{13}$
        title: *a1
        author: *a1
        format: *a1
        language: *a1
        priceMinor: *a13
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        effectiveQuantity: *a13
        shelf: *a1
        observedAt: *a4
        mappingStatus:
          type: string
          enum:
            - unresolved
            - suggested
            - confirmed
            - excluded
        eligible:
          type: boolean
        mappingId:
          type: string
          format: uuid
        onHand: &a14
          type: integer
          minimum: 0
        unitsSold90d: *a14
        entityId: *a15
        tags:
          type: array
          items: *a15
        color: *a15
        revision:
          type: integer
          minimum: 1
      required:
        - sku
        - isbn13
        - title
        - author
        - format
        - language
        - priceMinor
        - currency
        - effectiveQuantity
        - shelf
        - observedAt
        - mappingStatus
        - eligible
        - mappingId
    InventoryPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        nextCursor:
          type:
            - string
            - "null"
        revision: *a3
      required:
        - items
        - nextCursor
        - revision
    Entity:
      type: object
      additionalProperties: false
      properties:
        id: *a1
        name: *a1
        type:
          type: string
          enum:
            - movie
            - artist
            - book
        tags:
          type: array
          items: *a15
      required:
        - id
        - name
        - type
    CampaignDraft:
      type: object
      additionalProperties: false
      properties:
        title: *a1
        candidateSkus:
          type: array
          items: *a1
          minItems: 1
          maxItems: 500
        ruleRevisionIds:
          type: array
          items: *a2
      required:
        - title
        - candidateSkus
        - ruleRevisionIds
    Campaign:
      type: object
      additionalProperties: false
      properties:
        id: *a2
        versionId: *a2
        revision: *a3
        title: *a1
        state:
          type: string
          enum:
            - draft
            - approved
            - active
            - superseded
            - retired
        candidateSkus:
          type: array
          items: *a1
        ruleRevisionIds:
          type: array
          items: *a2
        inventoryImportId: *a2
        dataMode:
          type: string
          enum:
            - demo
            - pilot
        qrUrl:
          type:
            - string
            - "null"
          format: uri
        token: *a15
        plan: *a15
        evidenceRefs:
          type: array
          items:
            type: string
            format: uuid
        approvedAt:
          type: string
          format: date-time
      required:
        - id
        - versionId
        - revision
        - title
        - state
        - candidateSkus
        - ruleRevisionIds
        - inventoryImportId
        - dataMode
        - qrUrl
    RevisionRequest:
      type: object
      additionalProperties: false
      properties:
        expectedRevision: *a3
      required:
        - expectedRevision
    RuleInput:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - exclude_sku
            - require_language
            - require_format
            - max_price_minor
        operand:
          oneOf:
            - *a1
            - *a13
        scope:
          type: string
          enum:
            - store
            - campaign
        campaignId: *a2
        example:
          $ref: "#/components/schemas/RuleCase"
        counterexample:
          $ref: "#/components/schemas/RuleCase"
        reviewAt: *a4
      required:
        - type
        - operand
        - scope
        - example
        - counterexample
        - reviewAt
    RuleCase:
      type: object
      additionalProperties: false
      properties:
        sku: *a1
        language: *a1
        format: *a1
        priceMinor: *a13
        expectedPass:
          type: boolean
      required:
        - sku
        - language
        - format
        - priceMinor
        - expectedPass
    PublicCampaign:
      type: object
      additionalProperties: false
      properties:
        title: *a1
        storeName: *a1
        versionId: *a2
        dataMode:
          type: string
          enum:
            - demo
            - pilot
        providerMode:
          type: string
          enum:
            - live
            - fixture
            - unconfigured
        currency: *a1
        observedAt: *a4
        measurementNoticeVersion: *a1
      required:
        - title
        - storeName
        - versionId
        - dataMode
        - providerMode
        - currency
        - observedAt
        - measurementNoticeVersion
    ShopperSession:
      type: object
      additionalProperties: false
      properties:
        id: *a2
        campaignVersionId: *a2
        expiresAt: *a4
        measurementOptIn:
          type: boolean
        frozenPreferences:
          type:
            - object
            - "null"
          additionalProperties: false
          properties:
            interests:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  id: *a1
                  name: *a1
                required:
                  - id
