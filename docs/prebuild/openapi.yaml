openapi: 3.1.0
info:
  title: Second Shelf internal API — SS-S6-LOCAL-1
  version: 0.1.0-s6-local-1
  description: Frozen local synthetic target contract; implementation is partial and unchanged by this document.
    Existing endpoints have dated evidence; this is not current conformance or release proof. Prefix /api/v1.
    DATA_CONTRACTS Stage 6 defines the existing read-model supplement; BUILD_CONTRACT owns precedence and
    conditional full-product gates. Tenant derives from server sessions. Model, real identity and pilot
    contracts remain gated.
  x-historical-design-description: Design contract only. No endpoint is implemented. Prefix /api/v1. Tenant is
    derived from verified sessions, never trusted from request bodies. See DATA_CONTRACTS and
    SECURITY_PRIVACY. Job result appears only on success; error only on failure. Mutation idempotency stores
    actor/store/operation/body hash. Authentication-provider login/callback URLs are configured after vendor
    selection and are not invented here.
servers:
  - url: /api/v1
    description: Same-origin application API
security:
  - MerchantSession: []
paths:
  /demo-sessions:
    post:
      operationId: createDemoSession
      summary: Create an expiring isolated synthetic tenant
      description: Origin validation, abuse limits and server-created tenant required; sets Secure HttpOnly merchant
        lease cookie. Resets cannot touch other tenants.
      x-required-role: public
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSession"
          headers:
            Set-Cookie:
              description: Secure HttpOnly SameSite session-owned demo lease.
              schema:
                type: string
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
  /session:
    get:
      operationId: readMerchantSession
      summary: Read current authorized merchant context
      description: Read current authorized merchant context
      x-required-role: merchant
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  storeId: &a2
                    type: string
                    format: uuid
                  permissions:
                    type: array
                    items: &a1
                      type: string
                      minLength: 1
                      maxLength: 200
                  csrfToken: *a1
                  dataMode:
                    type: string
                    enum:
                      - demo
                      - pilot
                required:
                  - storeId
                  - permissions
                  - csrfToken
                  - dataMode
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /inventory-imports:
    post:
      operationId: previewInventoryImport
      summary: Stage and validate a CSV snapshot
      description: Stage and validate a CSV snapshot
      x-required-role: owner
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
  /inventory-imports/{id}/commit:
    post:
      operationId: commitInventoryImport
      summary: Activate explicitly accepted rows atomically
      description: Activate explicitly accepted rows atomically
      x-required-role: owner
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedRevision: &a3
                  type: integer
                  minimum: 1
                acceptedRowNumbers:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  minItems: 1
                  uniqueItems: true
              required:
                - expectedRevision
                - acceptedRowNumbers
  /inventory:
    get:
      operationId: listInventory
      summary: List current inventory and eligibility
      description: List current inventory and eligibility
      x-required-role: merchant
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPage"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: cursor
          in: query
          schema: *a1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
  /entities:
    get:
      operationId: searchEntities
      summary: Resolve confirmed interest or inventory entity choices
      description: Shopper may search movie/artist only. Book identity lookup requires merchant scope. Provider mode
        and source are retained in internal receipts; rate and budget limits apply.
      x-required-role: merchant_or_shopper
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entity"
                required:
                  - items
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - movie
              - artist
              - book
      security:
        - MerchantSession: []
        - ShopperSession: []
  /entity-mappings/{id}:
    patch:
      operationId: reviewEntityMapping
      summary: Confirm or exclude an inventory mapping
      description: Confirm or exclude an inventory mapping
      x-required-role: inventory_review
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedRevision: *a3
                status:
                  type: string
                  enum:
                    - confirmed
                    - excluded
                entityId: *a1
                reason: *a1
              required:
                - expectedRevision
                - status
                - reason
  /campaigns:
    get:
      operationId: listCampaigns
      summary: List scoped campaign summaries
      description: List scoped campaign summaries
      x-required-role: merchant
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Campaign"
                required:
                  - items
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCampaign
      summary: Create a draft campaign version
      description: Create a draft campaign version
      x-required-role: campaign_draft
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
