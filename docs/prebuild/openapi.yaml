          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
    patch:
      operationId: reviseCampaign
      summary: Create or revise draft; approved versions are immutable
      description: Create or revise draft; approved versions are immutable
      x-required-role: campaign_draft
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedRevision: *a3
                draft:
                  $ref: "#/components/schemas/CampaignDraft"
              required:
                - expectedRevision
                - draft
  /campaigns/{id}/plan:
    post:
      operationId: planCampaign
      summary: Queue a bounded cultural proposal
      description: Queue a bounded cultural proposal
      x-required-role: campaign_draft
      responses:
        "202":
          description: Accepted job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedRevision: *a3
                interestIds:
                  type: array
                  items: *a1
                  maxItems: 3
              required:
                - expectedRevision
  /campaigns/{id}/approve:
    post:
      operationId: approveCampaign
      summary: Approve campaign with revision check
      description: Checks current inventory/rules and prior state atomically. Activation updates QR destination and
        closes prior enrollment; never silently reassigns existing sessions.
      x-required-role: owner
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
  /campaigns/{id}/activate:
    post:
      operationId: activateCampaign
      summary: Activate campaign with revision check
      description: Checks current inventory/rules and prior state atomically. Activation updates QR destination and
        closes prior enrollment; never silently reassigns existing sessions.
      x-required-role: owner
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
  /campaigns/{id}/retire:
    post:
      operationId: retireCampaign
      summary: Retire campaign with revision check
      description: Checks current inventory/rules and prior state atomically. Activation updates QR destination and
        closes prior enrollment; never silently reassigns existing sessions.
      x-required-role: owner
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
  /rules:
    post:
      operationId: createRule
      summary: Create a reviewed structured correction rule
      description: campaignId required for campaign scope; numeric operand only for max_price_minor. Both example
        and counterexample must validate against deterministic evaluator before enabling.
      x-required-role: owner
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
  /rules/{id}/replay:
    post:
      operationId: replayRule
      summary: Replay a scoped rule against a candidate batch
      description: Replay a scoped rule against a candidate batch
      x-required-role: merchant
      responses:
        "202":
          description: Accepted job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                campaignVersionId: *a2
              required:
                - campaignVersionId
  /public/campaigns/{token}:
    get:
      operationId: readPublicCampaign
      summary: Read public active QR destination
      description: Read public active QR destination
      x-required-role: public
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCampaign"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: token
          in: path
          required: true
          schema: *a1
      security: []
  /public/campaigns/{token}/sessions:
    post:
      operationId: createShopperSession
      summary: Create or reuse scoped shopper session
      description: Origin validated. Sets Secure HttpOnly shopper cookie. Returns CSRF token through a same-origin
        response header. No arm assignment until eligible recommendation admission; demo never enters pilot
        analysis.
      x-required-role: public
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopperSession"
          headers:
            X-CSRF-Token:
              description: Scoped token required for subsequent shopper mutations.
              schema:
                type: string
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: token
          in: path
          required: true
          schema: *a1
        - $ref: "#/components/parameters/IdempotencyKey"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                measurementOptIn:
                  type: boolean
                  description: Omit to resume the existing choice, or default to false for a new visit. Explicit changes cannot
                    reroll an assigned experiment.
                noticeVersion: *a1
              required:
                - noticeVersion
  /shopper/recommendations:
    post:
      operationId: recommendBooks
      summary: Queue an eligible assigned or unmeasured recommendation
      description: Persist assignment before provider generation when measured. Changed interests/budget are frozen
        during a measured experiment session; return 409 with start-unmeasured guidance rather than rerolling.
        Exclusions can grow. Server independently recomputes eligibility.
      x-required-role: shopper
      responses:
        "202":
          description: Accepted job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      security:
        - ShopperSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRequest"
  /shopper/events:
    post:
      operationId: recordShopperEvent
      summary: Record an impression, interest or rejection
      description: Record an impression, interest or rejection
      x-required-role: shopper
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      security:
        - ShopperSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                runId: *a2
                sku: *a1
                type:
                  type: string
                  enum:
                    - impression
                    - interest
                    - reject
              required:
                - runId
                - sku
                - type
  /shopper/purchase-code:
    post:
      operationId: issuePurchaseCode
      summary: Issue a scoped expiring cashier-attribution code
      description: Issue a scoped expiring cashier-attribution code
      x-required-role: shopper
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code: *a1
                  expiresAt: &a4
                    type: string
                    format: date-time
                required:
                  - code
                  - expiresAt
        default:
          description: Typed failure; 400 validation, 401 authentication, 403 authority/origin, 404 scoped absence, 409
            conflict or unsafe state, 413 size, 422 no eligible items, 429 rate/budget, 502 upstream, 503
            configuration, 504 deadline. No hidden fixture fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      security:
        - ShopperSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                runId: *a2
              required:
                - runId
  /outcomes:
    post:
      operationId: verifyOutcome
      summary: Append a merchant-verified purchase, return or correction
      description: Only owner or outcome_verify staff may record. Purchases require an offered counter code/current
        SKU; title and ISBN are snapshotted. Adjustments use the original in-store purchase and its remaining
        quantity/amount, even after preference withdrawal or catalog removal. Original ledger and shopper
        deletion remain intact. Repeated reference/type/SKU returns the existing ID only for the same
        transaction details; changed details conflict. Adjustment time follows the original purchase within
        seven days.
      x-required-role: outcome_verify
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
